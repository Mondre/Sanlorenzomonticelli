[build]
command = "npm run check && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
# Public site/auth origins, intentionally present in links, source and generated HTML.
# Keep secret scanning enabled for every other variable, including DB/auth credentials.
SECRETS_SCAN_OMIT_KEYS = "SITE_URL,BETTER_AUTH_URL"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["sharp"]

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
X-Frame-Options = "DENY"
